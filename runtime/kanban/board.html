<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'none'; connect-src 'none'"><title>영상팀 보드</title>
<style>
:root{color-scheme:dark;--bg:#14181e;--card:#20262f;--text:#e9eef5;--muted:#9facbc;--line:#333d4a;--blue:#80b7ff;--orange:#f2ba76;--green:#8cd4b0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:12px -apple-system,BlinkMacSystemFont,sans-serif}header{padding:15px 16px 11px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line)}h1{font-size:16px;margin:0;white-space:nowrap}.spacer{flex:1}button,select{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:6px;font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--blue)}select{max-width:270px;min-width:80px}#meta{padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;color:var(--muted)}.badge{padding:4px 7px;background:var(--card);border-radius:5px}.attention{color:var(--orange)}.working{color:var(--blue)}main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:0 12px 14px}.column{min-width:0;background:#191e25;border-radius:9px;padding:8px}.column h2{font-size:11px;color:var(--muted);margin:3px 0 11px;display:flex;justify-content:space-between}.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px;margin:0 0 7px;overflow-wrap:anywhere}.card summary{font-weight:650;cursor:pointer}.status{font-size:10px;color:var(--muted);margin:7px 0;line-height:1.45;overflow-wrap:anywhere}.detail{font-size:11px;line-height:1.55;color:#c4cfde}.flag{font-size:10px;color:var(--orange);margin-top:5px}.source{font-size:10px;color:var(--muted);margin-top:9px}footer{position:sticky;bottom:0;padding:8px 14px;background:var(--bg);border-top:1px solid var(--line);color:var(--muted);font-size:10px}#empty{padding:24px;color:var(--muted)}#error{padding:10px 16px;color:var(--orange)}[hidden]{display:none!important}@media(max-width:550px){main{grid-template-columns:repeat(2,minmax(0,1fr))}header{flex-wrap:wrap}select{max-width:220px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
<header><h1>영상팀 <span style="color:var(--blue)">보드</span></h1><span class="spacer"></span><select id="projects" aria-label="프로젝트"></select><button id="refresh" aria-label="새로고침">↻</button><button id="collapse">접기</button></header>
<div id="error" hidden></div><div id="meta"></div><main id="board"></main><div id="empty" hidden>아직 등록된 영상 프로젝트가 없습니다.</div><footer id="footer">기록 읽는 중 · 제작·예약을 실행하지 않는 표시 전용 창</footer>
<script>
let data={projects:[]},selected='',manual=false,lastSignature='',lastPreferred='';
const $=id=>document.getElementById(id);
const columns=[['ready','준비'],['working','기록상 진행'],['attention','확인 필요'],['done','완료 기록']];
function node(tag,cls,value){const n=document.createElement(tag);if(cls)n.className=cls;if(value!==undefined)n.textContent=value;return n}
function bridge(action){if(window.webkit?.messageHandlers?.board)window.webkit.messageHandlers.board.postMessage(action)}
$('refresh').onclick=()=>bridge('refresh');$('collapse').onclick=()=>bridge('collapse');$('projects').onchange=()=>{selected=$('projects').value;manual=true;lastSignature='';render()};
function render(){const p=data.projects.find(p=>p.id===selected)||data.projects[0];$('empty').hidden=!!p;$('board').replaceChildren();$('meta').replaceChildren();if(!p)return;
 const schedule=node('span','badge '+p.schedule.tone,p.schedule.label);$('meta').append(schedule,node('span','badge','큐 기록 '+(p.queue.active??'—')+' · 회수 대기 '+(p.queue.backlog??'—')));
 const issues=p.cards.filter(c=>c.conflict).length;if(issues)$('meta').append(node('span','badge attention','상태 충돌 '+issues));
 for(const [id,title] of columns){const col=node('section','column');const cards=p.cards.filter(c=>c.column===id);const h=node('h2','',title);h.append(node('span','',String(cards.length)));col.append(h);for(const c of cards){const card=node('article','card');card.append(node('strong','',c.title),node('div','status',c.status));if(c.stale)card.append(node('div','flag','오래된 기록 / 시각 미확인'));if(c.conflict)card.append(node('div','flag','상태 기록 불일치'));const details=node('details','');details.append(node('summary','status','자세히'),node('div','detail',c.detail||'다음 작업 기록 없음'),node('div','source',c.source+' · '+(c.updated||'기록 시각 없음')));card.append(details);col.append(card)}$('board').append(col)}
 $('error').hidden=!p.errors.length;$('error').textContent=p.errors.join(' · ')
}
window.showError=message=>{$('error').hidden=false;$('error').textContent=message};
window.updateBoard=(incoming,preferred)=>{data=incoming;if(preferred!==lastPreferred){manual=false;lastPreferred=preferred;lastSignature=''}if(preferred&&!manual&&data.projects.some(p=>p.id===preferred))selected=preferred;if(!data.projects.some(p=>p.id===selected))selected=data.projects[0]?.id||'';
 const signature=JSON.stringify(data.projects);if(signature!==lastSignature){$('projects').replaceChildren(...data.projects.map(p=>{const o=node('option','',p.name);o.value=p.id;return o}));$('projects').value=selected;render();lastSignature=signature}
 $('footer').textContent='파일 확인 '+new Date(data.observed_at).toLocaleTimeString('ko-KR')+' · 5초 갱신 · 화면/생성 완료를 직접 검증한 상태 아님';
};
</script></html>
